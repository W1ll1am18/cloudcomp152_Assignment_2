<html>

<head>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/styles.css') }}" />
</head>

<body>
  <div class="container">

    <div class="user-area">
      <h2>Main Page</h2>
      <h3 id="welcome"></h3>
      <button onclick="logout()">Logout</button>
    </div>

    <h3>Search</h3>
    <form class="query_form" onsubmit="query(event)">
      <div>
        <label>Artist</label>
        <input id="artist" type="text" placeholder="Artist">
      </div>

      <div>
        <label>Song</label>
        <input id="song-title" type="text" placeholder="Song">
      </div>

      <div>
        <label>Album</label>
        <input id="album" type="text" placeholder="Album">
      </div>

      <div>
        <label>Year</label>
        <input id="year" type="text" placeholder="Year">
      </div>

      <button type="submit">Search</button>
    </form>

    <p id="error-message" style="color:red;"></p>

    <div id="results-container"></div>

  </div>

  <script>
      const API_BASE_URL = "";
      // const API_BASE_URL = "https://21wkhil4ig.execute-api.us-east-1.amazonaws.com/dev";

      const userName = localStorage.getItem("user_name");
      const email    = localStorage.getItem("email");

      if (!userName || !email) {
        window.location.href = "/login";
      }

      document.getElementById("welcome").innerText = "Welcome, " + userName;

      async function query(event) {
        event.preventDefault();

        const artist = document.getElementById("artist").value.trim();
        const song   = document.getElementById("song-title").value.trim();
        const album  = document.getElementById("album").value.trim();
        const year   = document.getElementById("year").value.trim();

        const container = document.getElementById("results-container");
        container.innerHTML = "";
        document.getElementById("error-message").innerText = "";

        //CARE FLASK uses song
        const params = new URLSearchParams();
        if (artist) params.append("artist", artist);
        if (song)   params.append("song", song);
        if (album)  params.append("album", album);
        if (year)   params.append("year", year);

        if (params.toString() === "") {
          document.getElementById("error-message").innerText = "At least one field must be completed.";
          return;
        }

        try {
          let url;

          if (API_BASE_URL === "") {
            url = `/query?${params.toString()}`;
          } else {
            //CARE - Lambda expects title 
            const lambdaParams = new URLSearchParams();
            if (artist) lambdaParams.append("artist", artist);
            if (song)   lambdaParams.append("title", song);
            if (album)  lambdaParams.append("album", album);
            if (year)   lambdaParams.append("year", year);
            url = `${API_BASE_URL}/music?${lambdaParams.toString()}`;
          }

          const response = await fetch(url, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
          });

          const data = await response.json();

          if (!response.ok) {
            document.getElementById("error-message").innerText = data.message || "No result is retrieved. Please query again";
            return;
          }

          const songs = data.songs || [];

          if (songs.length === 0) {
            document.getElementById("error-message").innerText = "No result is retrieved. Please query again";
            return;
          }

          songs.forEach(song => {
            const songDiv = document.createElement("div");
            songDiv.className = "song-item";

            songDiv.innerHTML = `
              <p><strong>Title:</strong>  ${song.title}</p>
              <p><strong>Artist:</strong> ${song.artist}</p>
              <p><strong>Year:</strong>   ${song.year}</p>
              <p><strong>Album:</strong>  ${song.album}</p>
              <img src="${song.image_url}" alt="${song.artist}" width="80">
              <button onclick='subscribe(${JSON.stringify(song)})'>Subscribe</button>
              <hr>
            `;

            container.appendChild(songDiv);
          });

        } catch (error) {
          document.getElementById("error-message").innerText = "Error connecting to server";
          console.error(error);
        }
      }

      function subscribe(song) {
        alert("Subscribe coming soon: " + song.title);
      }

      function logout() {
        localStorage.clear();
        window.location.href = "/login";
      }
  </script>

</body>
</html>
