<html>

<head>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/styles.css') }}" />
</head>

<body>
  <div class="container">

    <div class="user-area">
      <h2>Main Page</h2>
      <h3 id="welcome"></h3>
      <div class="subscriptions-area">
        <h3>My Subscriptions</h3>
        <hr>
        <div id="subscriptions-container"></div>
        <div>
          <button onclick="logout()">Logout</button>
        </div>
        <hr>
        <h3>Search</h3>
        <form class="query_form" onsubmit="query(event)">
          <div>
            <label>Artist</label>
            <input id="artist" type="text" placeholder="Artist">
          </div>

          <div>
            <label>Song</label>
            <input id="song-title" type="text" placeholder="Song">
          </div>

          <div>
            <label>Album</label>
            <input id="album" type="text" placeholder="Album">
          </div>

          <div>
            <label>Year</label>
            <input id="year" type="text" placeholder="Year">
          </div>

          <button type="submit">Search</button>
        </form>
        <hr>
        <p id="error-message" style="color:red;"></p>

        <div id="results-container"></div>

      </div>

      <script>
        // const API_BASE_URL = ""; //Leave empty for local flask
        const API_BASE_URL = "https://21wkhil4ig.execute-api.us-east-1.amazonaws.com/dev";

        const userName = localStorage.getItem("user_name");
        const email = localStorage.getItem("email");

        if (!userName || !email) {
          window.location.href = "/login";
        }

        document.getElementById("welcome").innerText = "Welcome, " + userName;
        getSubscriptions()

        async function query(event) {
          event.preventDefault();

          const artist = document.getElementById("artist").value.trim();
          const title = document.getElementById("song-title").value.trim();
          const album = document.getElementById("album").value.trim();
          const year = document.getElementById("year").value.trim();

          const container = document.getElementById("results-container");
          const error = document.getElementById("error-message");

          container.innerHTML = "";
          error.innerText = "";

          const params = new URLSearchParams();
          if (artist) params.append("artist", artist);
          if (title) params.append("title", title);
          if (album) params.append("album", album);
          if (year) params.append("year", year);

          if (params.toString() === "") {
            error.innerText = "At least one field must be completed.";
            return;
          }

          try {
            const response = await fetch(`${API_BASE_URL}/music?${params.toString()}`);
            const data = await response.json();

            if (!response.ok) {
              error.innerText = data.message || "No result is retrieved. Please query again";
              return;
            }

            const songs = Array.isArray(data) ? data : data.songs || [];

            if (songs.length === 0) {
              error.innerText = "No result is retrieved. Please query again";
              return;
            }

            songs.forEach(song => {
              const songDiv = document.createElement("div");
              songDiv.className = "song-item";

              songDiv.innerHTML = `
              <p><strong>Title:</strong> ${song.title}</p>
              <p><strong>Artist:</strong> ${song.artist}</p>
              <p><strong>Year:</strong> ${song.year}</p>
              <p><strong>Album:</strong> ${song.album}</p>
              <img src="${song.image_url}" alt="${song.artist}" width="80">
              <button onclick='subscribe(${JSON.stringify(song)})'>Subscribe</button>
              <hr>
            `;

              container.appendChild(songDiv);
            });

          } catch (error) {
            document.getElementById("error-message").innerText = "Error connecting to server";
            console.error(error);
          }
        }

        async function subscribe(song) {
          try {
            const response = await fetch(`${API_BASE_URL}/subscribe`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email: email,
                artist: song.artist,
                title: song.title,
                album: song.album,
                year: song.year,
                image_url: song.image_url
              })
            });

            const data = await response.json();

            if (!response.ok) {
              document.getElementById("error-message").innerText = data.message;
              return;
            }

            getSubscriptions();

          } catch (error) {
            document.getElementById("error-message").innerText = "Error connecting to server";
          }
        }

        async function removeSubscription(song) {
          try {
            const response = await fetch(`${API_BASE_URL}/subscribe`, {
              method: "DELETE",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                email: email,
                title: song.title,
                album: song.album
              })
            });

            const data = await response.json();

            if (!response.ok) {
              document.getElementById("error-message").innerText = data.message;
              return;
            }

            getSubscriptions();

          } catch (error) {
            document.getElementById("error-message").innerText = "Error connecting to server";
          }
        }

        async function getSubscriptions() {
          const params = new URLSearchParams();
          params.append("email", email);

          try {
            const response = await fetch(`${API_BASE_URL}/subscriptions?${params.toString()}`);
            const data = await response.json();

            const container = document.getElementById("subscriptions-container");
            container.innerHTML = "";

            if (!response.ok || !data.Subscriptions || data.Subscriptions.length === 0) {
              container.innerHTML = "<p>No subscriptions added</p>";
              return;
            }

            data.Subscriptions.forEach(sub => {
              const subDiv = document.createElement("div");
              subDiv.className = "subscription-item";

              subDiv.innerHTML = `
              <p><strong>Title:</strong> ${sub.title}</p>
              <p><strong>Artist:</strong> ${sub.artist}</p>
              <p><strong>Year:</strong> ${sub.year}</p>
              <p><strong>Album:</strong> ${sub.album}</p>
              <img src="${sub.image_url}" alt="${sub.artist}" width="80">
              <button onclick='removeSubscription(${JSON.stringify(sub)})'>Remove</button>
              <hr>
            `;

              container.appendChild(subDiv);
            });

          } catch (error) {
            document.getElementById("error-message").innerText = "Error connecting to server";
          }
        }

        function logout() {
          localStorage.clear();
          window.location.href = "/login";
        }
      </script>
</body>

</html>
