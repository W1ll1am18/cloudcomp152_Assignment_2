<html>

<head>
  <link rel="stylesheet" href="{{ url_for('static',filename='css/styles.css') }}" />
</head>

<body>
  <div class="container">
    <div class="login_container">
      <h2>Login</h2>

      <form class="login_form" onsubmit="loginUser(event)">
        <h3>Enter your email</h3>
        <input id="email" type="text" placeholder="Email" required>

        <h3>Enter your password</h3>
        <input id="password" type="password" placeholder="Password" required>

        <button type="submit">Login</button>
      </form>

      <p id="error-message" style="color:red;"></p>

      <p>Not a user?</p>
      <a href="http://localhost:5000/register" class="button">Register</a>
    </div>
  </div>

  <script>
    async function loginUser(event) {
      event.preventDefault();

      const apiUrl = "API KEY GO HERE";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          document.getElementById("error-message").innerText = data.message;
          return;
        }

        // Save user info
        localStorage.setItem("email", data.email);
        localStorage.setItem("user_name", data.user_name);

        // Redirect to main page
        window.location.href = "/";
      } catch (error) {
        document.getElementById("error-message").innerText = "Error connecting to server";
      }
    }
  </script>
</body>

</html>
